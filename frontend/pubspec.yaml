name: dream_assist
description: A Flutter application for DreamAssist learning platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  state_notifier: ^1.0.0

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  
  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.3
  
  # Navigation
  go_router: ^17.0.1
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  table_calendar: ^3.1.2
  
  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  
  # File Handling
  file_picker: ^10.3.8
  open_file: ^3.3.2
  path_provider: ^2.1.3
  
  # WebSocket for Chat
  web_socket_channel: ^3.0.3
  

  # Charts & Graphs
  fl_chart: ^0.68.0

  # Voice & Audio (Persona Module)
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2
  avatar_glow: ^2.0.2

  
  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  logger: ^2.3.0
  flutter_dotenv: ^6.0.0
  
  # PDF Viewer
  pdfx: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^4.0.0+1
  retrofit_generator: ^10.2.1
  json_serializable: ^6.8.0
  freezed: ^3.2.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
  #   - assets/icons/

